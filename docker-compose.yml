services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: event-storming-server
    ports:
      - "${SERVER_PORT:-4000}:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - server-data:/app/apps/server/data
    networks:
      - event-storming-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: event-storming-web
    ports:
      - "${WEB_PORT:-4173}:5173"
    environment:
      # Laissés vides par défaut : le front déduit l'hôte du server à partir de
      # celui utilisé pour charger la page (voir apps/web/src/config.ts).
      # Ne définir ces variables que pour forcer une adresse différente (ex: domaine public distinct).
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_SYNC_URL=${VITE_SYNC_URL:-}
    networks:
      - event-storming-network
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  event-storming-network:
    driver: bridge

volumes:
  server-data:
